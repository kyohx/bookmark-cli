name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            binary: bookmark
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            binary: bookmark
          - os: windows
            arch: amd64
            runner: windows-latest
            binary: bookmark.exe
          - os: darwin
            arch: universal
            runner: macos-latest
            binary: bookmark

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build (Linux / Windows)
        if: matrix.os != 'darwin'
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o dist/${{ matrix.binary }} ./cmd/bookmark

      - name: Build universal binary (macOS)
        if: matrix.os == 'darwin'
        env:
          CGO_ENABLED: 0
        run: |
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/bookmark-amd64 ./cmd/bookmark
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/bookmark-arm64 ./cmd/bookmark
          lipo -create -output dist/bookmark dist/bookmark-amd64 dist/bookmark-arm64

      - name: Archive binary
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            7z a bookmark-${{ matrix.os }}-${{ matrix.arch }}.zip ${{ matrix.binary }}
          else
            tar czf bookmark-${{ matrix.os }}-${{ matrix.arch }}.tar.gz ${{ matrix.binary }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bookmark-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
